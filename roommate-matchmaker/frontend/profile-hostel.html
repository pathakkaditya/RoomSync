<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hostel Preferences | RoomSync</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar">
        <div class="logo">Room<span>Sync</span></div>

        <div class="progress-text">
            Step <strong>4</strong> of 4
        </div>
    </nav>


    <main class="profile-page">

        <div class="progress-bar">
            <div class="progress-fill step-4"></div>
        </div>


        <section class="form-container">

            <div class="form-heading">
                <p class="section-label">STEP 04</p>

                <h1>Where would you like to stay?</h1>

                <p>
                    Rank your preferred hostels. We'll try to give you
                    the best available option based on your preferences.
                </p>
            </div>


            <form id="hostelForm">

                    <div class="rank-item">

                        <span class="rank-number">1</span>

                        <div>

                        <div>

                            <select id="hostel3" required>
