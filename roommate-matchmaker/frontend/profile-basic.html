<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Basic Information | RoomSync</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar">
        <div class="logo">Room<span>Sync</span></div>

        <div class="progress-text">
            Step <strong>1</strong> of 4
        </div>
    </nav>


    <main class="profile-page">

        <div class="progress-bar">
            <div class="progress-fill step-1"></div>
        </div>


        <section class="form-container">

            <div class="form-heading">
                <p class="section-label">STEP 01</p>

                <h1>Let's start with the basics.</h1>

                <p>
                    Tell us a little about yourself so we can find
                    students who are a good fit for you.
                </p>
            </div>


            <form id="basicForm">

                <div class="form-grid">

                    <div class="input-group full-width">
                        <label for="name">Full Name</label>

                        <input
                            type="text"
                            id="name"
                            placeholder="Enter your name"
                            required
                        >
                    </div>


                    <div class="input-group">
                        <label for="age">Age</label>

                        <input
                            type="number"
                            id="age"
                            placeholder="e.g. 18"
                            min="16"
                            max="30"
                            required
                        >
                    </div>


                    <div class="input-group">
                        <label for="gender">Gender</label>

                        <select id="gender" required>
                            <option value="">Select gender</option>
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                            <option value="other">Other</option>
                        </select>
                    </div>


                    <div class="input-group">
                        <label for="state">Home State</label>

                        <select id="state" required>
                            <option value="">Select state</option>
                            <option>Andhra Pradesh</option>
                            <option>Assam</option>
                            <option>Bihar</option>
                            <option>Chandigarh</option>
                            <option>Delhi</option>
                            <option>Gujarat</option>
                            <option>Haryana</option>
                            <option>Himachal Pradesh</option>
                            <option>Jharkhand</option>
                            <option>Jammu & Kashmir</option>
                            <option>Karnataka</option>
                            <option>Kerala</option>
                            <option>Madhya Pradesh</option>
                            <option>Maharashtra</option>
                            <option>Odisha</option>
                            <option>Punjab</option>
                            <option>Rajasthan</option>
                            <option>Tamil Nadu</option>
                            <option>Telangana</option>
                            <option>Uttar Pradesh</option>
                            <option>Uttarakhand</option>
                            <option>West Bengal</option>
                            <option>Other</option>
                        </select>
                    </div>


                    <div class="input-group">
                        <label for="year">Year of Study</label>

                        <select id="year" required>
                            <option value="">Select year</option>
                            <option>1st Year</option>
                            <option>2nd Year</option>
                            <option>3rd Year</option>
                            <option>4th Year</option>
                        </select>
                    </div>


                    <div class="input-group full-width">
                        <label for="college">College / University</label>

                        <input
                            type="text"
                            id="college"
                            placeholder="Enter your college"
                            required
                        >
                    </div>


                    <div class="input-group full-width">
                        <label for="course">Course</label>

                        <input
                            type="text"
                            id="course"
                            placeholder="e.g. B.Tech Computer Science"
                            required
                        >
                    </div>

                </div>


                <div class="form-footer">

                    <a href="index.html" class="back-btn">
                        ← Back
                    </a>

                    <button type="submit" class="primary-btn">
                        Continue →
                    </button>

                </div>

            </form>

        </section>

    </main>


    <script src="script.js"></script>

</body>
</html>
